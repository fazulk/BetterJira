# Electron builder configuration for BetterJira
appId: com.jefff.betterjira
productName: BetterJira
artifactName: BetterJira-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: electron/resources
# Electron boot code plus Nuxt's built `.output` are self-contained once the
# staged app dependencies are installed for Nitro's production server runtime.
files:
  - dist-electron/**/*
  - .output/**/*
  - env.local
  - package.json
# Publish config makes electron-builder emit latest*.yml update metadata and
# embed app-update.yml into resources for electron-updater, even though the
# build scripts pass --publish never (CI uploads release/ assets itself).
publish:
  provider: github
  owner: fazulk
  repo: better-jira
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
# asar stays disabled: it previously triggered an ElectronAsarIntegrity mismatch
# (electron-builder 25.1.8 + unsigned builds) that made Electron 40 exit silently,
# and re-enabling it now would only re-open that risk. Single-user personal tool,
# so unpacked JS in the .app is fine.
asar: false
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  # Developer ID signing + notarization. The identity is auto-discovered from the
  # keychain (or CSC_LINK in CI); notarization runs when APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set and is skipped otherwise.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.plist
linux:
  category: Development
  icon: icon-1024.png
  executableName: betterjira
  desktop:
    entry:
      StartupWMClass: BetterJira
win:
  icon: icon.ico
  signAndEditExecutable: false
